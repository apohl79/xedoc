name: Xedoc
options:
  bundleIdPrefix: org.e47.xedoc
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.77.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 62QZB3NCZR
    CODE_SIGN_STYLE: Automatic
targets:
  Xedoc:
    type: application
    platform: iOS
    sources: [Xedoc]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.e47.xedoc.mobile
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: Xedoc/Xedoc.entitlements
    attributes:
      SystemCapabilities:
        com.apple.Push:
          enabled: 1
    info:
      path: Xedoc/Info.plist
      properties:
        CFBundleDisplayName: Xedoc
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: Find Xedoc hosts and connect to their GUI on your local network.
        NSBonjourServices: [_xedoc-gui._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
schemes:
  Xedoc:
    build:
      targets:
        Xedoc: all
