packages:
  - desktop
  - desktop/prototypes/onepassword
  - xedoc-rs/responses-api-proxy/npm

patchedDependencies:
  electron-chrome-extensions@4.10.0: patches/electron-chrome-extensions-4.10.0.patch

ignoredBuiltDependencies:
  - esbuild

minimumReleaseAge: 10080
minimumReleaseAgeExclude: []

blockExoticSubdeps: true
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
trustPolicyExclude: []
allowBuilds:
  electron: true
