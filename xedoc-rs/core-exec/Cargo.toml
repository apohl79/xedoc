[package]
edition.workspace = true
license.workspace = true
name = "xedoc-core-exec"
version.workspace = true

[lib]
name = "xedoc_core_exec"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
arc-swap = { workspace = true }
async-channel = { workspace = true }
xedoc-config = { workspace = true }
xedoc-core-config = { workspace = true }
xedoc-core-environment = { workspace = true }
xedoc-exec-server = { workspace = true }
xedoc-file-system = { workspace = true }
xedoc-install-context = { workspace = true }
xedoc-execpolicy = { workspace = true }
xedoc-network-proxy = { workspace = true }
xedoc-otel = { workspace = true }
xedoc-protocol = { workspace = true }
xedoc-sandboxing = { workspace = true }
xedoc-shell-command = { workspace = true }
xedoc-utils-absolute-path = { workspace = true }
xedoc-utils-path-uri = { workspace = true }
xedoc-utils-output-truncation = { workspace = true }
xedoc-utils-pty = { workspace = true }
libc = { workspace = true }
shlex = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true, features = ["log"] }

[target.'cfg(windows)'.dependencies]

[dev-dependencies]
anyhow = { workspace = true }
dunce = { workspace = true }
maplit = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
which = { workspace = true }
