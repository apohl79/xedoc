[package]
edition.workspace = true
license.workspace = true
name = "xedoc-skills-extension"
version.workspace = true

[lib]
name = "xedoc_skills_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
xedoc-core-skills = { workspace = true }
xedoc-exec-server = { workspace = true }
xedoc-extension-api = { workspace = true }
xedoc-mcp = { workspace = true }
xedoc-otel = { workspace = true }
xedoc-protocol = { workspace = true }
xedoc-skills = { workspace = true }
xedoc-tools = { workspace = true }
xedoc-utils-path-uri = { workspace = true }
xedoc-utils-string = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
xedoc-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
