[package]
name = "xedoc-app-server-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "export"
path = "src/bin/export.rs"
test = false

[[bin]]
name = "write_schema_fixtures"
path = "src/bin/write_schema_fixtures.rs"
test = false

[lib]
name = "xedoc_app_server_protocol"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
xedoc-experimental-api-macros = { workspace = true }
xedoc-extension-items = { workspace = true }
xedoc-protocol = { workspace = true }
xedoc-shell-command = { workspace = true }
xedoc-utils-absolute-path = { workspace = true }
xedoc-utils-path-uri = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_with = { workspace = true }
strum_macros = { workspace = true }
thiserror = { workspace = true }
rmcp = { workspace = true, default-features = false, features = [
    "base64",
    "macros",
    "schemars",
    "server",
] }
ts-rs = { workspace = true }
inventory = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["serde", "v7"] }

[dev-dependencies]
anyhow = { workspace = true }
xedoc-utils-cargo-bin = { workspace = true }
pretty_assertions = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
