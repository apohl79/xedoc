[package]
name = "xedoc-lmstudio"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "xedoc_lmstudio"
path = "src/lib.rs"
doctest = false
test = false


[dependencies]
xedoc-core = { path = "../core" }
xedoc-model-provider-info = { path = "../model-provider-info" }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
tracing = { version = "0.1.44", features = ["log"] }
which = "8.0"

[lints]
workspace = true
