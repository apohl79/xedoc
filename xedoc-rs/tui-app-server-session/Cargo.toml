[package]
name = "xedoc-tui-app-server-session"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "xedoc_tui_app_server_session"
path = "src/lib.rs"
doctest = false

[features]
test-support = []

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
xedoc-app-server-client = { workspace = true }
xedoc-app-server-protocol = { workspace = true }
xedoc-core-config = { workspace = true }
xedoc-features = { workspace = true }
xedoc-message-history = { workspace = true }
xedoc-otel = { workspace = true }
xedoc-protocol = { workspace = true }
xedoc-tui-events = { workspace = true }
xedoc-tui-settings = { workspace = true }
xedoc-tui-status = { workspace = true }
xedoc-tui-transcript = { workspace = true }
xedoc-utils-absolute-path = { workspace = true }
xedoc-utils-path-uri = { workspace = true }
color-eyre = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
app_test_support = { workspace = true }
xedoc-arg0 = { workspace = true }
xedoc-config = { workspace = true }
xedoc-exec-server = { workspace = true }
xedoc-rollout = { workspace = true }
xedoc-tui-test-support = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
