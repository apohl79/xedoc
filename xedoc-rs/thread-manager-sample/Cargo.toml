[package]
name = "xedoc-thread-manager-sample"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "xedoc-thread-manager-sample"
path = "src/main.rs"
test = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Keep runtime API use routed through `xedoc-core-api`; `xedoc-features` is
# needed only to construct feature-specific `Config` values.
xedoc-core-api = { workspace = true }
xedoc-features = { workspace = true }
tracing = { workspace = true }
