[package]
name = "xedoc-thread-manager-sample"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "xedoc-thread-manager-sample"
path = "src/main.rs"
test = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Keep this sample limited to a single Xedoc workspace dependency.
# Add new Xedoc surface area to `xedoc-core-api` instead of depending on
# additional `xedoc-*` crates here.
xedoc-core-api = { workspace = true }
tracing = { workspace = true }
