<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="referrer" content="no-referrer">
    <title>XEDOC</title>
    <link id="favicon" rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/webui.css">
    <script src="/webui.js" defer></script>
  </head>
  <body>
    <main id="session" aria-label="Session">
      <button id="earlier" type="button" hidden>↑ Earlier history</button>
      <div id="history" aria-label="Conversation history"><div id="active" class="history-cell"></div></div>
      <section id="composer" aria-label="Session controls">
        <div id="activity" aria-live="polite"></div>
        <div id="live" hidden tabindex="0" aria-label="Session dialog"><div id="live-frame"></div></div>
        <section id="question" hidden aria-labelledby="question-heading"></section>
        <div id="entry">
          <div class="editor-row">
            <span class="prompt-marker" aria-hidden="true">❯</span>
            <div id="input" class="prompt-markdown" role="textbox" aria-label="Message" aria-multiline="true" contenteditable="false" data-placeholder="Message Xedoc…" spellcheck="true"><div class="editor-line"><br></div></div>
          </div>
          <div id="attachments" aria-label="File attachments"></div>
          <div class="entry-footer">
            <button id="attach" type="button" aria-label="Attach file" title="Attach file" disabled>＋</button>
            <input id="images" type="file" multiple hidden>
            <span id="session-name"></span>
            <span id="turn-timer"></span>
            <div id="settings">
              <span id="plugin-tools"></span>
              <button id="router" type="button" aria-haspopup="menu" aria-expanded="false" title="Change router mode">
                <svg class="router-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                  <path d="M3 13V9a3 3 0 0 1 3-3h4a3 3 0 0 0 3-3" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"/>
                  <circle cx="3" cy="13" r="2" fill="currentColor"/>
                  <circle cx="13" cy="3" r="2" fill="none" stroke="currentColor" stroke-width="2"/>
                </svg>
                <span class="router-mode"></span>
              </button>
              <button id="routerTable" type="button" aria-label="Change routing table" aria-haspopup="menu" aria-expanded="false" title="Change routing table" hidden>
                <svg class="router-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                  <rect x="2" y="2" width="12" height="12" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
                  <path d="M2 6h12M2 10h12M6 2v12" fill="none" stroke="currentColor" stroke-width="1.5"/>
                </svg>
                <span class="router-table"></span>
              </button>
              <button id="model" type="button" aria-haspopup="menu" aria-expanded="false" title="Change model"></button>
              <button id="effort" type="button" aria-haspopup="menu" aria-expanded="false" title="Change reasoning effort"></button>
            </div>
            <button id="voice" type="button" aria-label="Start voice conversation" aria-pressed="false" title="Start voice conversation" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect x="9" y="2" width="6" height="12" rx="3"></rect>
                <path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"></path>
              </svg>
            </button>
            <button id="voice-options" type="button" aria-label="Voice backend options" aria-haspopup="menu" aria-expanded="false" title="Voice backend options" hidden>⋯</button>
            <button id="send" type="button" aria-label="Send message" title="Send message" disabled>↑</button>
          </div>
          <div id="voice-status" role="status" aria-live="polite" hidden></div>
        </div>
        <div class="status-row"><span id="status"></span><span id="goal-status"></span><span id="connection" role="status">Connecting…</span></div>
      </section>
    </main>
    <div id="menu" role="menu" hidden></div>
    <div id="voice-menu" role="menu" aria-label="Voice backend" hidden>
      <button id="voice-backend" type="button" role="menuitemradio" aria-checked="false">Voice backend</button>
      <div class="voice-menu-note">Voice availability is being checked.</div>
    </div>
    <button id="quote-selection" type="button" hidden>❞ Quote</button>
    <div id="notice" role="alert" hidden></div>
  </body>
</html>
