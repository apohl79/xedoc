<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="referrer" content="no-referrer">
    <title>XEDOC</title>
    <link id="favicon" rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/webui.css">
    <script src="/webui.js" defer></script>
  </head>
  <body>
    <main id="session" aria-label="Session">
      <button id="earlier" type="button" hidden>↑ Earlier history</button>
      <div id="history" aria-label="Conversation history"><div id="active" class="history-cell"></div></div>
      <section id="composer" aria-label="Session controls">
        <div id="activity" aria-live="polite"></div>
        <div id="live" hidden tabindex="0" aria-label="Session dialog"></div>
        <section id="question" hidden aria-labelledby="question-heading"></section>
        <div id="entry">
          <div class="editor-row">
            <span class="prompt-marker" aria-hidden="true">❯</span>
            <div id="input" role="textbox" aria-label="Message" aria-multiline="true" contenteditable="false" data-placeholder="Message Xedoc…" spellcheck="true"><div class="editor-line"><br></div></div>
          </div>
          <div id="attachments" aria-label="File attachments"></div>
          <div class="entry-footer">
            <button id="attach" type="button" aria-label="Attach file" title="Attach file" disabled>＋</button>
            <input id="images" type="file" multiple hidden>
            <span id="session-name"></span>
            <span id="turn-timer"></span>
            <div id="settings">
              <button id="router" type="button" aria-haspopup="menu" aria-expanded="false" title="Change router mode">
                <svg class="router-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                  <path d="M3 13V9a3 3 0 0 1 3-3h4a3 3 0 0 0 3-3" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"/>
                  <circle cx="3" cy="13" r="2" fill="currentColor"/>
                  <circle cx="13" cy="3" r="2" fill="none" stroke="currentColor" stroke-width="2"/>
                </svg>
                <span class="router-mode"></span>
              </button>
              <button id="model" type="button" aria-haspopup="menu" aria-expanded="false" title="Change model"></button>
              <button id="effort" type="button" aria-haspopup="menu" aria-expanded="false" title="Change reasoning effort"></button>
            </div>
            <button id="send" type="button" aria-label="Send message" title="Send message" disabled>↑</button>
          </div>
        </div>
        <div class="status-row"><span id="status"></span><span id="connection" role="status">Connecting…</span></div>
      </section>
    </main>
    <div id="menu" role="menu" hidden></div>
    <button id="quote-selection" type="button" hidden>❞ Quote</button>
    <div id="notice" role="alert" hidden></div>
  </body>
</html>
