[package]
name = "xedoc-app-server-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "xedoc_app_server_client"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
xedoc-app-server = { workspace = true }
xedoc-app-server-protocol = { workspace = true }
xedoc-arg0 = { workspace = true }
xedoc-config = { workspace = true }
xedoc-core = { workspace = true }
xedoc-exec-server = { workspace = true }
xedoc-protocol = { workspace = true }
xedoc-uds = { workspace = true }
xedoc-utils-absolute-path = { workspace = true }
xedoc-utils-rustls-provider = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
