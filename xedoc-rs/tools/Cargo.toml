[package]
edition.workspace = true
license.workspace = true
name = "xedoc-tools"
version.workspace = true

[lints]
workspace = true

[dependencies]
xedoc-features = { workspace = true }
xedoc-file-system = { workspace = true }
xedoc-extension-items = { workspace = true }
xedoc-protocol = { workspace = true }
xedoc-utils-absolute-path = { workspace = true }
xedoc-utils-output-truncation = { workspace = true }
xedoc-utils-pty = { workspace = true }
xedoc-utils-string = { workspace = true }
jsonptr = { workspace = true }
rmcp = { workspace = true, default-features = false, features = [
    "base64",
    "macros",
    "schemars",
    "server",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
urlencoding = { workspace = true }

[dev-dependencies]
xedoc-utils-cargo-bin = { workspace = true }
pretty_assertions = { workspace = true }

[lib]
doctest = false
