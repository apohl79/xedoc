[package]
name = "codex-tui-transcript"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_tui_transcript"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[features]
default = []
test-support = []

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
codex-ansi-escape = { workspace = true }
codex-app-server-protocol = { workspace = true }
codex-config = { workspace = true }
codex-core-config = { workspace = true }
codex-features = { workspace = true }
codex-install-context = { workspace = true }
codex-mcp = { workspace = true }
codex-otel = { workspace = true }
codex-protocol = { workspace = true }
codex-shell-command = { workspace = true }
codex-tui-markdown = { workspace = true }
codex-tui-render = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-cli = { workspace = true }
codex-utils-elapsed = { workspace = true }
codex-utils-path-uri = { workspace = true }
crossterm = { workspace = true }
derive_more = { workspace = true, features = ["is_variant"] }
dirs = { workspace = true }
image = { workspace = true, features = ["jpeg", "png", "gif", "webp"] }
itertools = { workspace = true }
lazy_static = { workspace = true }
pulldown-cmark = { workspace = true }
rand = { workspace = true }
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
ratatui-macros = { workspace = true }
regex-lite = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json"] }
rmcp = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
shlex = { workspace = true }
supports-color = { workspace = true }
tempfile = { workspace = true }
textwrap = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
codex-home = { workspace = true }
codex-tui-test-support = { workspace = true }
codex-utils-cargo-bin = { workspace = true }
insta = { workspace = true }
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }
vt100 = { workspace = true }
