[package]
name = "codex-tui-app-server-session"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_tui_app_server_session"
path = "src/lib.rs"
doctest = false

[features]
test-support = []

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
codex-app-server-client = { workspace = true }
codex-app-server-protocol = { workspace = true }
codex-core-config = { workspace = true }
codex-features = { workspace = true }
codex-message-history = { workspace = true }
codex-otel = { workspace = true }
codex-protocol = { workspace = true }
codex-tui-events = { workspace = true }
codex-tui-settings = { workspace = true }
codex-tui-status = { workspace = true }
codex-tui-transcript = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-path-uri = { workspace = true }
color-eyre = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
app_test_support = { workspace = true }
codex-arg0 = { workspace = true }
codex-config = { workspace = true }
codex-exec-server = { workspace = true }
codex-rollout = { workspace = true }
codex-tui-test-support = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
